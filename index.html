<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <title>Same Uniqueness - Main Scene</title>
    <script src="lib/p5.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        .hint {
            position: fixed; bottom: 20px; left: 20px; color: #0ff;
            background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 8px;
            font-family: monospace; font-size: 14px; pointer-events: none; z-index: 100;
        }
        /* Statistics panel - always on top */
        #statsPanel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #0ff;
            border-radius: 12px;
            padding: 12px 20px;
            font-family: 'Courier New', monospace;
            color: #0ff;
            font-size: 14px;
            z-index: 200;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
            min-width: 200px;
            text-align: left;
        }
        #statsPanel h4 {
            margin: 0 0 8px 0;
            font-size: 16px;
            text-align: center;
        }
        #statsPanel p {
            margin: 4px 0;
            font-size: 13px;
        }
        .stat-value {
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="statsPanel">
        <h4>📊 STATISTICS</h4>
        <p>Special customized: <span id="totalSpecial" class="stat-value">0</span></p>
        <p>Current special: <span id="currentSpecial" class="stat-value">0</span> / <span id="totalPeople">60</span></p>
        <p>Resets: <span id="resetCount" class="stat-value">0</span></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0"></script>
    <script src="https://unpkg.com/ml5@1.3.0/dist/ml5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
    <script src="globals.js"></script>
    <script src="modelLoader.js"></script>
    <script src="People3D.js"></script>
    <script src="buildings.js"></script>
    <script src="sketch.js"></script>
</body>
</html>
